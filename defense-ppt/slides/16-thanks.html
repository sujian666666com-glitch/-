<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1E5128; font-family: Arial, sans-serif; display: flex; flex-direction: column;
  align-items: center; justify-content: center; color: #FFFFFF;
}
.top-bar { position: absolute; top: 0; left: 0; right: 0; height: 8pt; background: #F39C12; }
h1 { font-size: 36pt; margin: 0 0 16pt 0; font-weight: bold; }
.sub { font-size: 18pt; margin: 0 0 40pt 0; color: #E8F5E9; }
.info { text-align: center; }
.info p { margin: 0 0 8pt 0; font-size: 14pt; color: #F4F6F6; }
.qa { margin-top: 30pt; background: rgba(255,255,255,0.15); padding: 12pt 30pt; border-radius: 30pt; }
.qa p { margin: 0; font-size: 16pt; color: #FFFFFF; }
</style>
</head>
<body>
<div class="top-bar"></div>
<h1>谢谢各位老师！</h1>
<p class="sub">敬请批评指正</p>
<div class="info">
  <p>答辩人：赵庆</p>
  <p>指导教师：陈金山</p>
  <p>广州城市理工学院 · 通信工程学院</p>
</div>

</body>
</html>
